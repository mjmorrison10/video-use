# Captain Sinbad (Nikhil Pandey) — CINEMATIC self-help auteur. This profile deliberately DIVERGES
# from the loud podcast house style (Montserrat Black caps + yellow). Per agency-agent analysis
# (short-video coach · video-optimization · social strategist · visual storyteller), a cinematic
# brand needs RESTRAINT: a literary subtitle system + composition-preserving framing. The loud kit
# "reads as cheap hype on graded footage" and undercuts the premium perception that IS his funnel.
name: captainsinbad
captions:
  # "literary subtitle": clean premium sans (vendored Inter SemiBold), SENTENCE CASE, warm
  # bone-white, soft drop shadow (no highlighter block), gentle fade in — like film subtitles.
  font: "Inter SemiBold"
  size: 60
  bold: false
  uppercase: false                # sentence case — ALL-CAPS is the #1 "hype clip" tell
  strip_punctuation: false        # keep commas/periods — reads literary, not karaoke
  primary: "&H00E6EFF4"           # warm bone-white #F4EFE6 (ASS AABBGGRR), not pure #FFF
  accent: "&H00E6EFF4"            # monochrome — no yellow highlight (kill the loudness)
  outline_colour: "&H00121212"    # thin near-black stroke for legibility over footage
  back_colour: "&H90000000"       # semi-transparent drop shadow (not an opaque box)
  outline: 1                      # thin stroke, not the podcast's chunky 6px
  shadow: 2                       # soft drop shadow carries legibility
  align_an: 5                     # middle-center anchor (\pos places it)
  # full-bleed (monologue) clips: captions CENTRED on screen, 2-3 words, one line.
  pos: {x: 540, y: 980}
  max_words: 3
  max_chars: 18
  # blur-fill (fit/fit-center) clips: captions auto-placed just BELOW the video window, and
  # allowed a longer phrase (film-subtitle) for dialogue — captions.py applies these.
  fit_max_words: 5
  fit_max_chars: 28
  merge_below_s: 0.30
  anim: fade                      # gentle opacity rise, NOT the scale-in pop
  fade: {in: 200, out: 150}
# Framing default = blur-fill (the full 16:9 frame over a grade-matched blurred fill of itself):
# preserves cinematic composition AND leaves no black bars. Per-clip override in jobs.json:
#   drama / embedded-clip shots -> "fit" (blur-fill, keep the whole frame)
#   monologue close-ups that survive a crop -> "center-crop" (full-bleed)
framing: fit
subject_filter: {fx: [0, 1920], fy: [120, 620], w: [130, 520]}
music:
  # cinematic: keep his own score present; if we add a bed, gentle and never ducked to zero.
  lo: 0.06
  hi: 0.12
  end: 0.05
  duck_ratio: 2.0
  duck_thresh: 0.12
